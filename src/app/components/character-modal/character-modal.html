<div class="modal-header">
    <h4 class="modal-title">{{ characterDetail?.name }}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
    <img [src]="characterDetail?.image" class="card-img-top" alt="...">
    <p>Estado: {{ characterDetail?.status }}</p>
    <p>Especie: {{ characterDetail?.species }}</p>
    <p>Origen: {{ characterDetail?.origin?.name }}</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.close()">Cerrar</button>
</div>
